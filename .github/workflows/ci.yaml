name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci_stable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm ]

    steps:
      - name: Fetch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: Build native
        run: cargo build --all-targets --all-features --verbose

      - name: Install and start gnome-keyring
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          # run gnome-keyring with 'foobar' as the password for the login keyring
          # this will create a new login keyring and unlock it
          # the login password doesn't matter, but the keyring must be unlocked for the tests to work
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'

      - name: Test native
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        run: cargo test --lib --all-features --verbose

      - name: Build iOS
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-ios
          cargo build --target aarch64-apple-ios --all-features --verbose

      - name: Setup Android NDK
        if: matrix.os == 'ubuntu-latest'
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build Android
        if: matrix.os == 'ubuntu-latest'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a build --all-features --verbose

  ci_msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install rust MSRV
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.88
          components: clippy

      - name: Clippy check
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings
