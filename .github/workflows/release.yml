name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false

      - name: Check tag matches package version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Generate short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-token

      - name: Publish
        run: cargo publish --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-token.outputs.token }}
